<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c192c" />
      <stop offset="70%" stop-color="#060a12" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="35%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#083344" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Cyber Tech Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#083344" stroke-width="2" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#0e7490" stroke-width="4" stroke-dasharray="14 8 4 8" opacity="0.6" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="80 18 12 18" filter="url(#neonBlur)" opacity="0.8" />
  
  <!-- Outer Radial ticks -->
  <g stroke="#06b6d4" stroke-width="3" opacity="0.7">
    <line x1="256" y1="46" x2="256" y2="70" />
    <line x1="256" y1="442" x2="256" y2="466" />
    <line x1="46" y1="256" x2="70" y2="256" />
    <line x1="442" y1="256" x2="466" y2="256" />
    <line x1="108" y1="108" x2="124" y2="124" />
    <line x1="404" y1="108" x2="388" y2="124" />
    <line x1="108" y1="404" x2="124" y2="388" />
    <line x1="404" y1="404" x2="388" y2="388" />
  </g>

  <!-- Segmented Energy Arc Reactor Rings -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#0891b2" stroke-width="6" stroke-dasharray="160 30 50 30" opacity="0.85" />
  <circle cx="256" cy="256" r="116" fill="none" stroke="#67e8f9" stroke-width="4" stroke-dasharray="24 12" filter="url(#neonBlur)" />

  <!-- Reactor Core Hexagon / Shield -->
  <polygon points="256,160 339,208 339,304 256,352 173,304 173,208" fill="#04121f" stroke="#06b6d4" stroke-width="5" filter="url(#neonBlur)" />

  <!-- Inner Glowing Arc Orb -->
  <circle cx="256" cy="256" r="64" fill="url(#coreGlow)" filter="url(#neonBlur)" />

  <!-- Stylized "J" Symbol / Central AI Nexus -->
  <path d="M 280 200 L 280 280 C 280 302 264 316 242 316 C 224 316 212 304 212 288" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Central Pulse Core Point -->
  <circle cx="256" cy="256" r="8" fill="#ffffff" filter="url(#neonBlur)" />

  <!-- Mini HUD telemetry details -->
  <text x="256" y="380" font-family="'Orbitron', sans-serif" font-size="16" font-weight="700" fill="#22d3ee" letter-spacing="4" text-anchor="middle" opacity="0.9">JARVIS AI</text>
  <text x="256" y="400" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="600" fill="#67e8f9" letter-spacing="2" text-anchor="middle" opacity="0.75">ADAM BOYS · MOBILE</text>
</svg>
